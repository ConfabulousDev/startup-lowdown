name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Only public files
        run: |
          for path in evals tools; do
            if [ -e "$path" ]; then echo "::error::$path/ must not be in this repository"; exit 1; fi
          done

      - uses: astral-sh/setup-uv@v10.2.0

      - name: Skill matches the Agent Skills spec
        run: uvx --from skills-ref==0.1.1 agentskills validate skills/startup-lowdown

      - name: Scripts compile
        run: python3 -m py_compile skills/startup-lowdown/scripts/*.py

      - name: Manifests parse and versions agree
        run: python3 .github/check_manifests.py
